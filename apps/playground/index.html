<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GistUI examples: ask, and watch the interface stream in</title>
    <meta name="description" content="A chat that answers in real GistUI screens: dashboards, forms, reports and slide decks, streamed at 300 tokens per second." />
    <link rel="icon" href="%BASE_URL%favicon.svg" />
    <link rel="preload" href="%BASE_URL%fonts/geist.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      try {
        var t = localStorage.getItem("theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/chat/main.tsx"></script>
  </body>
</html>
